<!-- AI was used to fix the styling of website. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #status {
            margin: 25px 0;
            font-size: 18px;
        }

        #recordingIndicator {
            display: none;
            margin: 20px;
            font-weight: bold;
        }

        #timer {
            display: none;
            margin: 10px;
            font-size: 16px;
        }

        #transcript {
            margin-top: 30px;
            padding: 20px;
            min-height: 100px;
            border: 1px solid #ccc;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Speech to Text</h1>

    <div id="status">
        Ready to record
    </div>

    <div id="recordingIndicator">
        🔴 Recording...
    </div>

    <div id="timer">
        00:00
    </div>

    <button id="startButton">
        Start Recording
    </button>

    <button id="stopButton" disabled>
        Stop Recording
    </button>

    <div id="transcript">
        Your transcription will appear here.
    </div>

    <script>

        let mediaRecorder;
        let audioChunks = [];
        let mediaStream;

        let recordingStartTime;
        let timerInterval;

        const MAX_RECORDING_TIME = 60 * 1000;

        const startButton =
            document.getElementById("startButton");

        const stopButton =
            document.getElementById("stopButton");

        const status =
            document.getElementById("status");

        const recordingIndicator =
            document.getElementById("recordingIndicator");

        const timer =
            document.getElementById("timer");

        const transcript =
            document.getElementById("transcript");


        startButton.addEventListener(
            "click",
            startRecording
        );

        stopButton.addEventListener(
            "click",
            stopRecording
        );


        async function startRecording() {

            try {
<!-- Request permisions to use microphone. -->
                mediaStream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                audioChunks = [];

                mediaRecorder =
                    new MediaRecorder(mediaStream);


                mediaRecorder.addEventListener(
                    "dataavailable",
                    event => {

                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }

                    }
                );


                mediaRecorder.addEventListener(
                    "stop",
                    sendAudio
                );


                mediaRecorder.start();


                recordingStartTime = Date.now();

                startTimer();


                status.textContent =
                    "Recording in progress...";

                recordingIndicator.style.display =
                    "block";

                timer.style.display =
                    "block";


                startButton.disabled = true;

                stopButton.disabled = false;


                transcript.textContent = "";


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Could not access the microphone.";

                resetPage();

            }

        }


        function stopRecording() {

            if (!mediaRecorder ||
                mediaRecorder.state === "inactive") {

                return;
            }


            mediaRecorder.stop();


            stopTimer();


            status.textContent =
                "Processing transcription...";


            recordingIndicator.style.display =
                "none";

            stopButton.disabled = true;

            startButton.disabled = true;


            <!-- Release the microphone after recording. -->
            if (mediaStream) {

                mediaStream.getTracks().forEach(
                    track => track.stop()
                );

            }

        }


        async function sendAudio() {

            const audioBlob =
                new Blob(audioChunks, {
                    type: mediaRecorder.mimeType
                });


            const formData =
                new FormData();


            formData.append(
                "audio",
                audioBlob,
                "recording.webm"
            );


            /*
             * Record the time at which the request
             * is sent so we can measure how long
             * transcription takes.
             */
            const processingStartTime =
                Date.now();


            try {

                const response =
                    await fetch(
                        "/api/v1/transcribe",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Transcription request failed."
                    );

                }


                const data =
                    await response.json();


                /*
                 * Display the transcription immediately
                 * after the server responds.
                 */
                transcript.textContent =
                    data.text;


                const processingTime =
                    (Date.now() -
                    processingStartTime) / 1000;


                console.log(
                    "Transcription processing time: "
                    + processingTime.toFixed(2)
                    + " seconds"
                );


                status.textContent =
                    "Ready to record again.";


            } catch (error) {

                console.error(error);

                transcript.textContent =
                    "An error occurred while transcribing.";


                status.textContent =
                    "Ready to record again.";


            } finally {

                /*
                 * Always return the page to a state
                 * where a new recording can be made.
                 */
                resetPage();

            }

        }


        function resetPage() {

            startButton.disabled = false;

            stopButton.disabled = true;

            recordingIndicator.style.display =
                "none";

            timer.style.display =
                "none";

            stopTimer();

        }


        function startTimer() {

            timer.textContent =
                "00:00";


            timerInterval =
                setInterval(() => {

                    const elapsed =
                        Date.now() -
                        recordingStartTime;


                    const seconds =
                        Math.floor(elapsed / 1000);


                    const minutes =
                        Math.floor(seconds / 60);


                    const remainingSeconds =
                        seconds % 60;


                    timer.textContent =
                        String(minutes).padStart(2, "0")
                        + ":"
                        + String(remainingSeconds).padStart(2, "0");


                    /*
                     * Automatically stop after 60 seconds.
                     */
                    if (elapsed >= MAX_RECORDING_TIME) {

                        stopRecording();

                    }

                }, 100);

        }


        function stopTimer() {

            if (timerInterval) {

                clearInterval(timerInterval);

                timerInterval = null;

            }

        }

    </script>

</body>

</html>
